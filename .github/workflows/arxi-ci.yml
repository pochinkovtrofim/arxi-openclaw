name: Arxi fork gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: arxi-fork-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  OPENCLAW_VITEST_MAX_WORKERS: "2"

jobs:
  runtime-contract:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Setup production Node toolchain
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"

      - name: Resolve exact change and qualified upstream bases
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          change_base="$EVENT_BASE"
          if [[ ! "$change_base" =~ ^[0-9a-f]{40}$ || "$change_base" =~ ^0+$ ]]; then
            change_base="$(git rev-parse HEAD^)"
          fi
          upstream_base="$(tr -d '[:space:]' < ARXI_UPSTREAM_PIN)"
          [[ "$upstream_base" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --filter=blob:none --depth=1 origin "$change_base" "$upstream_base"
          test "$(git cat-file -t "$upstream_base")" = commit
          history_limit=4096
          if ! git merge-base --is-ancestor "$upstream_base" HEAD; then
            git fetch --no-tags --filter=blob:none --deepen="$history_limit" origin "$GITHUB_SHA"
          fi
          git merge-base --is-ancestor "$upstream_base" HEAD
          echo "ARXI_DIFF_BASE=$change_base" >> "$GITHUB_ENV"
          echo "ARXI_UPSTREAM_BASE=$upstream_base" >> "$GITHUB_ENV"

      - name: Format and lint changed Arxi-owned source
        run: |
          set -euo pipefail
          mapfile -d '' formatted < <(
            git diff --name-only -z "$ARXI_DIFF_BASE" HEAD -- \
              'extensions/telegram/**' \
              'extensions/codex/**' \
              'extensions/openai/openai-provider.test.ts' \
              'extensions/openai/openai-provider.ts' \
              'packages/gateway-protocol/src/schema/agent.ts' \
              'src/agents/agent-bundle-mcp-*.ts' \
              'src/agents/embedded-agent-runner/run/attempt-bundle-tools.ts' \
              'src/agents/mcp-connection-resolver*.ts' \
              'src/agents/mcp-oauth-identity*.ts' \
              'src/agents/prepared-model-catalog-worker.integration.test.ts' \
              'src/agents/prepared-model-catalog-worker.ts' \
              'src/agents/prepared-model-catalog.worker.ts' \
              'src/agents/runtime-plan/**' \
              'src/auto-reply/**' \
              'src/channels/**' \
              'src/commands/models/list.rows.ts' \
              'src/commands/models/list.rows.projection.test.ts' \
              'src/gateway/agent-turn/agent-run-execution-phase*.ts' \
              'src/gateway/server-methods/agent-request-types.ts' \
              'src/infra/outbound/**' \
              'src/plugins/registry-registrars-network*.ts' \
              'src/plugins/types.mcp-connection.ts' \
              'src/plugins/plugin-metadata-snapshot.test.ts' \
              'src/plugins/plugin-metadata-snapshot.ts' \
              'src/plugin-sdk/**' \
              'scripts/plugin-sdk-surface-report.mts' \
              'package.json' \
              'config/assertion-safety-baseline.txt' |
              while IFS= read -r -d '' path; do
                if git diff --quiet "$ARXI_UPSTREAM_BASE" HEAD -- "$path"; then
                  continue
                fi
                case "$path" in
                  *.js|*.mjs|*.ts|*.mts|*.json|*.jsonc) printf '%s\0' "$path" ;;
                esac
              done
          )
          if (( ${#formatted[@]} > 0 )); then
            pnpm format:check "${formatted[@]}"
          fi
          mapfile -d '' linted < <(
            printf '%s\0' "${formatted[@]}" |
              while IFS= read -r -d '' path; do
                case "$path" in *.js|*.mjs|*.ts|*.mts) printf '%s\0' "$path" ;; esac
              done
          )
          if (( ${#linted[@]} > 0 )); then
            node scripts/run-oxlint.mjs "${linted[@]}"
          fi
          pnpm check:assertion-safety
          pnpm plugin-sdk:surface:check

      - name: Reject unclassified production changes
        run: |
          set -euo pipefail
          declare -A shipped_files=()
          while IFS= read -r path; do
            shipped_files["$path"]=1
