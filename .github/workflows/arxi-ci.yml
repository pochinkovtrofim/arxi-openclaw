name: Arxi fork gate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: arxi-fork-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  OPENCLAW_VITEST_MAX_WORKERS: "2"

jobs:
  runtime-contract:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup production Node toolchain
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          node-version: ${{ env.NODE_VERSION }}
          install-bun: "false"

      - name: Resolve exact change base
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail
          base="$EVENT_BASE"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git fetch --no-tags --depth=1 origin "$base"
          echo "ARXI_DIFF_BASE=$base" >> "$GITHUB_ENV"

      - name: Format and lint changed Arxi-owned source
        run: |
          set -euo pipefail
          mapfile -d '' formatted < <(
            git diff --name-only -z "$ARXI_DIFF_BASE" HEAD -- \
              'extensions/telegram/**' \
              'extensions/codex/**' \
              'extensions/openai/openai-provider.test.ts' \
              'extensions/openai/openai-provider.ts' \
              'src/agents/prepared-model-catalog-worker.integration.test.ts' \
              'src/agents/prepared-model-catalog-worker.ts' \
              'src/agents/prepared-model-catalog.worker.ts' \
              'src/agents/runtime-plan/**' \
              'src/auto-reply/**' \
              'src/channels/**' \
              'src/commands/models/list.rows.ts' \
              'src/commands/models/list.rows.projection.test.ts' \
              'src/infra/outbound/**' \
              'src/plugins/plugin-metadata-snapshot.test.ts' \
              'src/plugins/plugin-metadata-snapshot.ts' \
              'src/plugin-sdk/**' \
              'scripts/plugin-sdk-surface-report.mts' \
              'package.json' \
              'config/assertion-safety-baseline.txt' |
              while IFS= read -r -d '' path; do
                case "$path" in
                  *.js|*.mjs|*.ts|*.mts|*.json|*.jsonc) printf '%s\0' "$path" ;;
                esac
              done
          )
          if (( ${#formatted[@]} > 0 )); then
            pnpm format:check "${formatted[@]}"
          fi
          mapfile -d '' linted < <(
            printf '%s\0' "${formatted[@]}" |
              while IFS= read -r -d '' path; do
                case "$path" in *.js|*.mjs|*.ts|*.mts) printf '%s\0' "$path" ;; esac
              done
          )
          if (( ${#linted[@]} > 0 )); then
            node scripts/run-oxlint.mjs "${linted[@]}"
          fi
          pnpm check:assertion-safety
          pnpm plugin-sdk:surface:check

      - name: Reject unclassified production changes
        run: |
          set -euo pipefail
          declare -A shipped_files=()
          while IFS= read -r path; do
            shipped_files["$path"]=1
          done <<'EOF'
          extensions/telegram/src/bot-message-context.session.ts
          extensions/telegram/src/bot/body-helpers.ts
          extensions/telegram/src/bot/helpers.ts
          extensions/telegram/src/external-context-projection.test.ts
          extensions/telegram/src/external-context-projection.ts
          extensions/telegram/src/outbound-media.ts
          extensions/telegram/src/rich-plain-fallback.ts
          extensions/telegram/src/send-error-predicates.ts
          extensions/telegram/src/send-message.ts
          extensions/telegram/src/telegram-context-rendering.ts
          extensions/telegram/src/telegram-runtime-planning.ts
          extensions/telegram/transport-plan-api.ts
          extensions/openai/openai-provider.test.ts
          extensions/openai/openai-provider.ts
          src/agents/prepared-model-catalog-worker.integration.test.ts
          src/agents/prepared-model-catalog-worker.ts
          src/agents/prepared-model-catalog.worker.ts
          src/agents/agent-tool-definition-adapter.ts
          src/agents/agent-tools.before-tool-call.wrapper.ts
          src/agents/runtime-plan/types.ts
          src/agents/tools/common.ts
          src/auto-reply/reply/agent-runner-execute.ts
          src/auto-reply/reply/agent-runner.runreplyagent.e2e.test.ts
          src/auto-reply/reply/reply-operation-agent-turn-state.ts
          src/auto-reply/reply-payload.test.ts
          src/auto-reply/reply-payload.ts
          src/channels/message/types.ts
          src/commands/models/list.rows.projection.test.ts
          src/commands/models/list.rows.ts
          src/infra/heartbeat-runner-delivery.ts
          src/infra/heartbeat-runner-execution.ts
          src/infra/heartbeat-runner.structured-delivery.test.ts
          src/infra/outbound/deliver-channel.ts
          src/infra/outbound/deliver-contracts.ts
          src/infra/outbound/deliver-core.ts
          src/infra/outbound/deliver-prepare.ts
          src/infra/outbound/deliver.test.ts
          src/infra/outbound/delivery-queue-media-spool.test.ts
          src/infra/outbound/delivery-queue-media-spool.ts
          src/infra/outbound/delivery-queue-reconciliation.test.ts
          src/infra/outbound/delivery-queue-reconciliation.ts
          src/infra/outbound/message-plan.test.ts
          src/infra/outbound/message-plan.ts
          src/infra/outbound/payloads.test.ts
          src/infra/outbound/payloads.ts
          src/infra/outbound/prepared-batch.ts
          src/plugins/plugin-metadata-snapshot.test.ts
          src/plugins/plugin-metadata-snapshot.ts
          src/plugins/tools.optional.test.ts
          src/plugins/tools.ts
          src/plugin-sdk/media-mime.ts
          scripts/plugin-sdk-surface-report.mts
          package.json
          pnpm-lock.yaml
          pnpm-workspace.yaml
          tsconfig.core.json
          tsconfig.extensions.json
          tsconfig.extensions.projects.json
          EOF
          failed=false
          while IFS= read -r -d '' path; do
            if [[ -n "${shipped_files[$path]:-}" ]]; then
              continue
            fi
            case "$path" in
              src/**|extensions/**|packages/**|config/**|scripts/**|tsconfig*.json)
                echo "unclassified shipped source: $path" >&2
                failed=true
                ;;
            esac
          done < <(git diff --name-only -z "$ARXI_DIFF_BASE" HEAD)
          test "$failed" = false

      - name: Validate Arxi workflow contract
        run: pnpm check:workflows

      - name: Typecheck shipped core and extensions
        run: pnpm tsgo:core && pnpm tsgo:extensions

      - name: Test fork seams consumed by Arxi
        run: |
          pnpm test \
            extensions/openai/openai-provider.test.ts \
            extensions/telegram/src/external-context-projection.test.ts \
            src/agents/prepared-model-catalog-worker.integration.test.ts \
            src/auto-reply/reply-payload.test.ts \
            src/commands/models/list.rows.projection.test.ts \
            src/infra/outbound/delivery-queue-media-spool.test.ts \
            src/infra/outbound/delivery-queue-reconciliation.test.ts \
            src/infra/outbound/message-plan.test.ts \
            src/infra/outbound/payloads.test.ts \
            src/plugins/plugin-metadata-snapshot.test.ts
          pnpm exec vitest run src/infra/outbound/deliver.test.ts \
            -t 'passes an explicitly classified durable final run without a reply dispatcher|passes the originating run correlation to model-authored media sends|does not label non-final text, status, or error payloads as useful results'
          pnpm exec vitest run src/infra/heartbeat-runner.structured-delivery.test.ts \
            -t 'retains the exact agent run on a useful heartbeat delivery'
          pnpm exec vitest run src/plugins/tools.optional.test.ts \
            -t 'preserves tool-owned execution preparation across the descriptor cache'
          node scripts/run-vitest.mjs run --config test/vitest/vitest.e2e.config.ts \
            src/auto-reply/reply/agent-runner.runreplyagent.e2e.test.ts \
            -t 'records the operation owned by an admitted heartbeat run'

      - name: Build exact Linux runtime surface
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm build

      - name: Verify the public Telegram planning seam
        run: |
          set -euo pipefail
          test -f dist/extensions/telegram/transport-plan-api.js
          test -f dist/extensions/telegram/transport-plan-api.d.ts
          node --input-type=module <<'EOF'
          import {
            planTelegramPhotoDocumentDelivery,
            planTelegramTextDeliveryPages,
            projectTelegramExternalMessageContext,
          } from "./dist/extensions/telegram/transport-plan-api.js";
          for (const exported of [
            planTelegramPhotoDocumentDelivery,
            planTelegramTextDeliveryPages,
            projectTelegramExternalMessageContext,
          ]) {
            if (typeof exported !== "function") process.exit(1);
          }
          EOF
