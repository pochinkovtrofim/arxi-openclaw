              continue
            fi
            case "$path" in
              src/**|extensions/**|packages/**|config/**|scripts/**|tsconfig*.json)
                echo "unclassified shipped source: $path" >&2
                failed=true
                ;;
            esac
          done < <(git diff --name-only -z "$ARXI_DIFF_BASE" HEAD)
          test "$failed" = false

      - name: Validate Arxi workflow contract
        run: pnpm check:workflows

